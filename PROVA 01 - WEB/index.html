<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Cadastro de Produtos Eletrônicos</h1>
    <form id="formProduto" class="formulario">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" placeholder="Informe o nome do produto">

      <label for="preco">Preço:</label>
      <input type="number" id="preco" placeholder="Informe o preço do produto">

      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" placeholder="Informe quantos produtos são">

      <button id="btnAdicionar" >ADICIONAR</button>
    </form>

    <p id="mensagem" class="mensagem" role="alert"></p>

    <section>
      <h2>Produtos cadastrados</h2>
      <ul id="lista" class="lista"></ul>

      <div class="totais">
        <p>Total de produtos: <strong id="totalProdutos">0</strong></p>
        <p>Valor total do estoque: <strong>R$ <span id="valorEstoque">0,00</span></strong></p>

      </div>
    </section>  
  </main>
  <script src="script.js"></script>
</body>
</html>
