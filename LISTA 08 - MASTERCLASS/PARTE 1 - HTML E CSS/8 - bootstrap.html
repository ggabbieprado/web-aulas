<!--
container:
Centraliza o conteúdo com largura máxima responsiva e padding lateral.

row:
Cria uma linha do grid (flex container) que agrupa as colunas.

col-md-4:
A partir do breakpoint md (≥768px), a coluna ocupa 4 de 12 (1/3). Abaixo disso, vale col-12 → 100% (empilhado).

card:
Componente de cartão com borda, espaçamento e estrutura para título/texto/rodapé.

btn:
Classe base de botão (padding, borda, tipografia, estados). btn-primary aplica a cor primária do tema.

-->
