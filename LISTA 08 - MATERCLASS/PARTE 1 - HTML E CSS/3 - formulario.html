<form action="/cadastrar" method="post">
  <label for="nome">Nome:</label>
  <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

  <label for="email">E-mail:</label>
  <input type="email" id="email" name="email" placeholder="voce@email.com" required>

  <label for="idade">Idade:</label>
  <input type="number" id="idade" name="idade" min="1" max="120" required>

  <label for="curso">Curso:</label>
  <select id="curso" name="curso" required>
    <option value="">Selecione...</option>
    <option value="ads">ADS</option>
    <option value="si">Sistemas de Informação</option>
  </select>

  <button type="submit">Cadastrar</button>
</form>

<!-- 
id:
Identificador único no documento. 
Usado por <label for>, CSS (#id) e JS (getElementById).

name:
Nome da chave enviada ao servidor na submissão (name=valor). 
Também agrupa radio/checkbox. 
Não precisa ser único (exceto em grupos).

type:	
Define o tipo de controle e validação: text, email, number, password, date etc.

placeholder:
Texto de dica exibido quando o campo está vazio. 
Não substitui o <label> e não é enviado ao servidor.
-->
