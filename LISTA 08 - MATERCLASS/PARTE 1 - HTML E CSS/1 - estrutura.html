<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Página</title>
</head>
<body>
  <h1>Hello World!</h1>
</body>
</html>

<!-- 
head: 
guarda metadados (título da aba, charset, viewport, links para CSS/JS, favicon). 
Nada ali é exibido no corpo da página.

body: 
contém todo o conteúdo visível e interativo (textos, imagens, formulários, scripts que manipulam a página).

meta charset="UTF-8": 
define a codificação de caracteres. 
Sem isso, acentos e símbolos (ç, ã, €) podem aparecer corrompidos. 
UTF-8 cobre praticamente todos os idiomas.
 -->
